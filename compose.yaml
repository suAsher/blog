name: asher-knowledge

services:
  blog:
    image: asher-knowledge:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BLOG_INCLUDE_EXAMPLES: ${BLOG_INCLUDE_EXAMPLES:-1}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
